name: Publicera Personalhandbok
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bygg sökbar handbok
        run: python scripts/build.py
      - name: Synka webbapp till repots rot för Pages från main
        run: |
          cp dist/index.html dist/style.css dist/app.js dist/sw.js dist/manifest.webmanifest dist/icon.svg dist/icon-192.png dist/icon-512.png dist/catalog.json .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f index.html style.css app.js sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png catalog.json .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Update published handbook catalog"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4
